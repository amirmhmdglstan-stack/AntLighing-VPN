[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antlighting-vpn"
version = "1.0.0"
description = "AntLighting VPN — a one-click Windows VPN front-end for the V2Ray/Xray ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AntLighting contributors" }]
keywords = ["vpn", "v2ray", "xray", "proxy", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = ["PySide6>=6.6,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.scripts]
antlighting = "antlighting.app:main"

[tool.setuptools.packages.find]
include = ["antlighting*"]

[tool.setuptools.package-data]
"antlighting.ui" = ["*.qml", "*.js", "*.png", "*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["error::DeprecationWarning:antlighting.*"]
